<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spot17: Imli - Details</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        .property-detail {
            max-width: 1200px;
            margin: 2rem auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            padding: 2rem;
        }

        .property-detail-gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        .property-detail-gallery img {
            width: 320px;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .property-detail-gallery img:hover {
            transform: scale(1.04);
        }

        .property-detail-info p {
            margin: 0.5rem 0;
        }

        .img-popup-bg {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .img-popup-bg.active {
            display: flex;
        }

        .img-popup-bg img {
            max-width: 90vw;
            max-height: 90vh;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
        }

        .img-popup-bg .close-btn {
            position: absolute;
            top: 30px;
            right: 40px;
            color: #fff;
            font-size: 2.5rem;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <a href="Stays.html" style="margin:1rem;display:inline-block;">← Back to Stays</a>
    <div class="property-detail">
        <h1>Spot17: Imli</h1>
        <div class="property-detail-gallery">
            <img src="imli4.jpg" alt="Spot17: Imli" />
            <img src="imli2.jpg" alt="Spot17: Imli" />
            <img src="imli3.jpg" alt="Spot17: Imli" />
            <img src="imli5.jpg" alt="Spot17: Imli" />
            <img src="imli6.jpg" alt="Spot17: Imli" />
            <img src="imli1.jpg" alt="Spot17: Imli" />
        </div>
        <div class="property-detail-info">
            <p><strong>Price:</strong> ₹6,000/night</p>
            <p><strong>Location:</strong> Nature Lovers Resort, Indore</p>
            <p><strong>Tags:</strong> Serene nature vibe & Night pool</p>
            <p><strong>Rating:</strong> ⭐⭐⭐⭐⭐</p>
            <p><strong>Description:</strong> Experience the serene vibe of nature with a night pool, perfect for
                relaxation and family fun.</p>
        </div>
    </div>
    <div class="img-popup-bg" id="imgPopup">
        <span class="close-btn" onclick="closeImgPopup()">&times;</span>
        <img id="popupImg" src="" alt="Zoomed Image" />
    </div>
    <script>
        // Image popup logic
        document.querySelectorAll('.property-detail-gallery img').forEach(img => {
            img.addEventListener('click', function () {
                document.getElementById('popupImg').src = this.src;
                document.getElementById('imgPopup').classList.add('active');
            });
        });
        function closeImgPopup() {
            document.getElementById('imgPopup').classList.remove('active');
        }
        document.getElementById('imgPopup').addEventListener('click', function (e) {
            if (e.target === this) closeImgPopup();
        });
    </script>
</body>

</html>
