<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spot17: Blossom - Details</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        .property-detail {
            max-width: 1200px;
            margin: 2rem auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            padding: 2rem;
            display: flex;

            gap: 1rem;

        }

        .property-detail-gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        .property-detail-gallery img {
            width: 320px;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .property-detail-gallery img:hover {
            transform: scale(1.04);
        }

        .property-detail-info p {
            margin: 0.5rem 0;
        }

        .img-popup-bg {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.2);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .img-popup-bg.active {
            display: flex;
        }

        .img-popup-bg img {
            max-width: 90vw;
            max-height: 90vh;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
        }

        .img-popup-bg .close-btn {
            position: absolute;
            top: 30px;
            right: 40px;
            color: #fff;
            font-size: 2.5rem;
            cursor: pointer;
            font-weight: bold;
        }

        .book-now-btn {
            display: inline-block;
            background: linear-gradient(135deg, #1b5e20, #2e7d32);
            color: white;
            padding: 1rem 2.5rem;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.1rem;
            margin-top: 1.5rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(27, 94, 32, 0.2);
        }

        .book-now-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(27, 94, 32, 0.3);
            background: linear-gradient(135deg, #2e7d32, #388e3c);
        }
    </style>
</head>

<body>
    <a href="index.html" style="margin:1rem;display:inline-block;">← Back to Stays</a>
    <h1 style="text-align: center;">Spot17: Blossom</h1>
    <div class="property-detail">
        <div class="property-detail-gallery">
            <img src="./lodgeimg/lg (1).jpg" alt="Spot17: Blossom" />
            <img src="./lodgeimg/lg (2).jpg" alt="Spot17: Blossom" />
            <img src="./lodgeimg/lg (3).jpg" alt="Spot17: Blossom" />
            <img src="./lodgeimg/lg (4).jpg" alt="Spot17: Blossom" />
            <img src="./lodgeimg/lg (5).jpg" alt="Spot17: Blossom" />
            <img src="./lodgeimg/lg (6).jpg" alt="Spot17: Blossom" />
            <img src="./lodgeimg/lg (7).jpg" alt="Spot17: Blossom" />
            <img src="./lodgeimg/lg (8).jpg" alt="Spot17: Blossom" />
        </div>
        <div class="property-detail-info">
            <p><strong>Price:</strong> ₹6,500/night</p>
            <p><strong>Location:</strong> Nature Lovers Resort, Indore</p>
            <p><strong>Tags:</strong> Pool side relaxation & nature vibes</p>
            <p><strong>Rating:</strong> ⭐⭐⭐⭐⭐</p>
            <p><strong>Description:</strong> Relax by the pool and enjoy the natural vibes in this beautiful stay,
                perfect for unwinding and recharging.</p>
            <a href="index.html#contact" class="book-now-btn">Book Now</a>
        </div>
    </div>
    <div class="img-popup-bg" id="imgPopup">
        <span class="close-btn" onclick="closeImgPopup()">&times;</span>
        <img id="popupImg" src="" alt="Zoomed Image" />
    </div>
    <script>
        // Image popup logic
        document.querySelectorAll('.property-detail-gallery img').forEach(img => {
            img.addEventListener('click', function () {
                document.getElementById('popupImg').src = this.src;
                document.getElementById('imgPopup').classList.add('active');
            });
        });
        function closeImgPopup() {
            document.getElementById('imgPopup').classList.remove('active');
        }
        document.getElementById('imgPopup').addEventListener('click', function (e) {
            if (e.target === this) closeImgPopup();
        });
    </script>
</body>

</html>
